services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node1
    networks:
      - app-network
    restart: unless-stopped

  node1:
    build: .
    environment:
      - INSTANCE_ID=node1
      - PORT=3000
    networks:
      - app-network
    restart: unless-stopped

  node2:
    build: .
    environment:
      - INSTANCE_ID=node2
      - PORT=3000
    networks:
      - app-network
    restart: unless-stopped

  node3:
    build: .
    environment:
      - INSTANCE_ID=node3
      - PORT=3000
    networks:
      - app-network
    restart: unless-stopped

  node4:
    build: .
    environment:
      - INSTANCE_ID=node4
      - PORT=3000
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
